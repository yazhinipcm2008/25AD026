<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Expense Tracker</h1>
    <p class="subtitle">Manage your expenses and budgets</p>


    <!-- ================= EXPENSE ================= -->

    <div class="card">

        <h2>Add Expense</h2>

        <form id="expenseForm">

            <label for="expenseAmount">Amount</label>
            <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Enter amount"
                    required
            >

            <label for="expenseCategory">Category</label>
            <input
                    type="text"
                    id="expenseCategory"
                    placeholder="Example: Food"
                    required
            >

            <label for="expenseDate">Date</label>
            <input
                    type="date"
                    id="expenseDate"
                    required
            >

            <button type="submit">
                Add Expense
            </button>

        </form>

    </div>


    <!-- ================= BUDGET ================= -->

    <div class="card">

        <h2>Add Budget</h2>

        <form id="budgetForm">

            <label for="budgetAmount">Amount</label>
            <input
                    type="number"
                    id="budgetAmount"
                    placeholder="Enter budget amount"
                    required
            >

            <label for="budgetCategory">Category</label>
            <input
                    type="text"
                    id="budgetCategory"
                    placeholder="Example: Food"
                    required
            >

            <label for="budgetMonth">Month</label>
            <input
                    type="text"
                    id="budgetMonth"
                    placeholder="Example: September"
                    required
            >

            <label for="budgetUserId">User ID</label>
            <input
                    type="number"
                    id="budgetUserId"
                    placeholder="Enter user ID"
                    required
            >

            <button type="submit">
                Add Budget
            </button>

        </form>

    </div>


    <!-- ================= BUDGET LIST ================= -->

    <div class="card">

        <div class="heading-row">

            <h2>Budgets</h2>

            <button
                    type="button"
                    onclick="loadBudgets()"
                    class="secondary-button">
                Refresh
            </button>

        </div>

        <div id="budgetList">
            Loading budgets...
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
